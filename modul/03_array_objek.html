<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 03 - Array &amp; Objek</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; line-height: 1.6; color: #1f2937; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; margin-top: 1.6rem; }
    .kartu { border: 1px solid #d1d5db; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; }
    th { background: #f3f4f6; }
    input { padding: 6px 8px; border: 1px solid #9ca3af; border-radius: 6px; }
    button { padding: 6px 12px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    .btn-hapus { background: #dc2626; }
  </style>
  <script src="03_array_objek.js" defer></script>
</head>
<body>
  <h1>Latihan Pertemuan 01 - Array &amp; Objek</h1>

  <div class="kartu">
    <h2>5. Tambah Mahasiswa (CRUD sederhana)</h2>
    <input type="text" id="input-nama" placeholder="Nama mahasiswa">
    <input type="text" id="input-nim" placeholder="NIM">
    <input type="text" id="input-jurusan" placeholder="Jurusan">
    <input type="number" id="input-nilai" placeholder="Nilai" min="0" max="100">
    <button id="btn-tambah">Tambah</button>
    <p id="pesan-crud" style="color:#dc2626; font-size:0.9rem;"></p>
  </div>

  <div id="result"></div>
</body>
</html>
